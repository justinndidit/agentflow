name: global-hiring-pipeline
namespace: default
workflow_version: 1
workers: 8
timeout: 2m
max_tokens: 250000

tasks:
  # ============================================
  # STAGE 1 — MARKET RESEARCH
  # ============================================

  - task_key: collect-market-data
    agent: research-agent
    priority: 4
    max_retries: 3
    timeout: 300
    input:
      roles:
        - "backend engineer"
        - "distributed systems engineer"
        - "platform engineer"
      locations:
        - "Canada"
        - "Germany"
        - "Netherlands"
      experience: "junior-mid"
      salary_currency: "USD"

  - task_key: scrape-job-boards
    agent: scraper-agent
    priority: 2
    max_retries: 3
    timeout: 600
    depends_on:
      - collect-market-data
    input:
      sources:
        - linkedin
        - indeed
        - greenhouse
        - lever
      keywords:
        - "Go"
        - "Java"
        - "Kafka"
        - "microservices"
        - "distributed systems"

  - task_key: deduplicate-jobs
    agent: data-agent
    priority: 2
    max_retries: 2
    timeout: 180
    depends_on:
      - scrape-job-boards
    input:
      strategy: fuzzy-match
      threshold: 0.82

  - task_key: classify-companies
    agent: intelligence-agent
    priority: 2
    max_retries: 2
    timeout: 300
    depends_on:
      - deduplicate-jobs
    input:
      classify_by:
        - startup
        - fintech
        - big-tech
        - infrastructure
        - AI
      enrich:
        - funding_stage
        - remote_policy
        - visa_sponsorship

  # ============================================
  # STAGE 2 — PROFILE ANALYSIS
  # ============================================

  - task_key: analyze-resume
    agent: resume-agent
    priority: 4
    max_retries: 2
    timeout: 120
    input:
      resume_path: ./input/resume.pdf
      target_roles:
        - "backend engineer"
        - "platform engineer"

  - task_key: analyze-github
    agent: github-agent
    priority: 2
    max_retries: 2
    timeout: 180
    input:
      github_username: surgee
      focus:
        - architecture
        - code_quality
        - consistency
        - technologies

  - task_key: build-skill-gap-report
    agent: career-agent
    priority: 2
    max_retries: 2
    timeout: 180
    depends_on:
      - analyze-resume
      - analyze-github
      - classify-companies
    input:
      compare_against_market: true

  # ============================================
  # STAGE 3 — MATCHING ENGINE
  # ============================================

  - task_key: rank-jobs
    agent: matching-agent
    priority: 2
    max_retries: 2
    timeout: 120
    depends_on:
      - build-skill-gap-report
      - classify-companies
    input:
      scoring:
        tech_stack_weight: 0.4
        salary_weight: 0.2
        visa_weight: 0.2
        growth_weight: 0.2

  - task_key: filter-top-opportunities
    agent: ranking-agent
    priority: 2
    max_retries: 1
    timeout: 60
    depends_on:
      - rank-jobs
    input:
      top_k: 20
      minimum_match_score: 0.75

  # ============================================
  # STAGE 4 — DOCUMENT GENERATION
  # ============================================

  - task_key: generate-custom-resume
    agent: writer-agent
    priority: 2
    max_retries: 2
    timeout: 300
    depends_on:
      - filter-top-opportunities
    input:
      # template expressions are stored unresolved and resolved at dispatch (not yet implemented)
      jobs: "{{ tasks.filter-top-opportunities.output.jobs }}"
      template: backend-modern
      emphasize:
        - distributed systems
        - Kafka
        - Go
        - Java
        - microservices

  - task_key: generate-cover-letter
    agent: writer-agent
    priority: 2
    max_retries: 2
    timeout: 300
    depends_on:
      - generate-custom-resume
      - filter-top-opportunities
    input:
      jobs: "{{ tasks.filter-top-opportunities.output.jobs }}"
      tone: professional
      personalization: high
      include_company_research: true

  - task_key: generate-outreach-message
    agent: networking-agent
    priority: 1
    max_retries: 2
    timeout: 180
    depends_on:
      - classify-companies
    input:
      platform: linkedin

      style: concise

  # ============================================
  # STAGE 5 — TECHNICAL PREP
  # ============================================

  - task_key: generate-interview-questions
    agent: interview-agent
    priority: 2

    max_retries: 2
    timeout: 180
    depends_on:
      - filter-top-opportunities
    input:
      categories:
        - system-design
        - concurrency
        - Kafka
        - Go
        - Java
        - databases
        - distributed-systems

  - task_key: create-study-plan
    agent: mentor-agent
    priority: 1
    max_retries: 2
    timeout: 120
    depends_on:
      - build-skill-gap-report
      - generate-interview-questions
    input:
      duration_weeks: 8
      daily_hours: 4

  # ============================================
  # STAGE 6 — APPLICATION EXECUTION
  # ============================================

  - task_key: submit-applications
    agent: automation-agent
    priority: 4
    max_retries: 1
    timeout: 600
    depends_on:
      - generate-custom-resume
      - generate-cover-letter
    input:
      auto_fill_forms: true
      upload_documents: true

  - task_key: track-application-status
    agent: tracking-agent
    priority: 1
    max_retries: 3
    timeout: 120
    depends_on:
      - submit-applications
    input:
      update_database: true
      notify_on_change: true

  # ============================================
  # STAGE 7 — REPORTING
  # ============================================

  - task_key: generate-dashboard
    agent: analytics-agent
    priority: 1
    max_retries: 2
    timeout: 120
    depends_on:
      - track-application-status
    input:
      metrics:
        - applications_sent
        - interviews_received
        - response_rate
        - top_regions
        - salary_distribution

  - task_key: notify-user
    agent: notification-agent
    priority: 1
    max_retries: 3
    timeout: 60
    depends_on:
      - generate-dashboard
    input:
      channels:
        - email
        - telegram
      include_summary: true
      attach_reports: true
