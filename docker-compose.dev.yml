services:
  postgres:
    image: postgres:16-alpine
    container_name: agentflow_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${DB_NAME:-agentflow_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    networks:
      - agentflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DB_USER:-postgres} -d $${DB_NAME:-agentflow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  agentflow_network:
    driver: bridge